<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="420" fill="#f7f9fc"/>
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0b1f3a">Dokumen yang Perlu Disiapkan (Bisnis Domestik Indonesia)</text>

  <!-- Card 1: Individu / UMKM Perorangan -->
  <rect x="40" y="70" width="440" height="310" rx="16" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
  <text x="260" y="105" text-anchor="middle" font-size="18" font-weight="700" fill="#0d6efd">👤 Individu / UMKM Perorangan</text>
  <g font-size="15" fill="#0b1f3a">
    <text x="65" y="150">✅ KTP pemilik bisnis (jelas, tidak buram/miring)</text>
    <text x="65" y="180">✅ NPWP pribadi</text>
    <text x="65" y="210">✅ Rekening bank (nama sama dengan KTP)</text>
    <text x="65" y="240">✅ Link website / media sosial / marketplace</text>
    <text x="65" y="270">   aktif yang menampilkan produk &amp; harga</text>
    <text x="65" y="310" font-style="italic" fill="#555">Cocok untuk: warung, resto kecil, UMKM,</text>
    <text x="65" y="330" font-style="italic" fill="#555">toko online perorangan</text>
  </g>

  <!-- Card 2: Badan Usaha -->
  <rect x="520" y="70" width="440" height="310" rx="16" fill="#ffffff" stroke="#198754" stroke-width="2"/>
  <text x="740" y="105" text-anchor="middle" font-size="18" font-weight="700" fill="#198754">🏢 Badan Usaha (PT / CV / PMA)</text>
  <g font-size="15" fill="#0b1f3a">
    <text x="545" y="145">✅ Akta Perusahaan terbaru</text>
    <text x="545" y="172">✅ SK Menkumham (akta perubahan/pendirian)</text>
    <text x="545" y="199">✅ KTP/Paspor Direktur</text>
    <text x="545" y="226">✅ NPWP Direktur &amp; NPWP Perusahaan</text>
    <text x="545" y="253">✅ NIB / SIUP / TDP</text>
    <text x="545" y="280">✅ Izin usaha lain sesuai bidang bisnis</text>
    <text x="545" y="320" font-style="italic" fill="#555">Cocok untuk: resto berbadan hukum,</text>
    <text x="545" y="340" font-style="italic" fill="#555">bisnis dengan CV/PT resmi</text>
  </g>
</svg>
